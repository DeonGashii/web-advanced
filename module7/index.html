<!DOCTYPE html>
<html>
    <head>

        <title>Home Page</title>
        
    </head>
    <body>
        
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="Firstname">Firstname</label>
                <br><input type="text"  id="FirstName" name="FirstName"><br>
                <br><label for="Lastname">Lastname</label>
                <br><input type="text"  id="Lastname" name="Lastname"><br>
                <br><label for="Email">Email</label>
                <br><input type="email"  id="Email" name="Email"><br>
                <br><label for="Password">Password</label>
                <br><input type="password"  id="Password" name="Password"><br>
                <br><label >Gender:</label>
                <br><label for="Male">Male</label>
                <input type="radio"  id="Male" name="Male">
                <br><label for="Female">Female</label>
                <input type="radio"  id="Female" name="Female"><br>
                <br><label>Hobbies:</label>
                <br><label for="Gaming">Gaming</label>
                <input type="checkbox"  id="Gaming" name="Gaming" value="Gaming">
                <br><label for="Football">Football</label>
                <input type="checkbox"  id="Football" name="Football" value="Football">
                <br><label for="Swimming">Swimming</label>
                <input type="checkbox"  id="Swimming" name="Swimming" value="Swimming"><br>
                <br><select id="pet" name="pet">
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Parrot">Parrot</option>
                </select><br>
                <textarea name="message" rows="10" col="20"></textarea><br><br>
                <br><input type="submit"  id="Submit" name="Submit">
            </fieldset>
        </form>
    </body>
</html>
